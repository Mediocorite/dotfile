# picom - minimal compositor config for Xorg + i3 on Intel integrated graphics.
#
# Deliberately cheap: no blur, no fading, no opacity rules. The only per-frame
# work is rounded corners and one light shadow, and `use-damage` limits even
# that to the region that actually changed. This keeps the iGPU idle so it
# stays available for everything else.

backend = "glx";
vsync = true;          # prevents tearing; costs nothing on Intel
use-damage = true;     # redraw only damaged regions - the big power win

# GLX tuning for Intel
glx-no-stencil = true;
glx-no-rebind-pixmap = true;

# ── rounded corners ──────────────────────────────────────────────────────────
corner-radius = 8;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'",
    "class_g = 'i3-frame'"
];

# ── a single soft shadow; cheap, and it separates tiles nicely ───────────────
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.35;
shadow-offset-x = -12;
shadow-offset-y = -10;
shadow-color = "#000000";
shadow-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'",
    "class_g = 'i3-frame'",
    "_GTK_FRAME_EXTENTS@:c"
];

# ── everything expensive stays off ───────────────────────────────────────────
fading = false;
blur-background = false;
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-dim = 0.0;

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
unredir-if-possible = true;   # fullscreen video/games bypass the compositor

wintypes:
{
    dock          = { shadow = false; };
    desktop       = { shadow = false; };
    dnd           = { shadow = false; };
    tooltip       = { shadow = false; };
    popup_menu    = { shadow = true; };
    dropdown_menu = { shadow = true; };
};
